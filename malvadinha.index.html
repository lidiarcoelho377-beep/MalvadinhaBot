(function() {

    var dark  = "https:\/\/wired-cardinal.10web.cloud\/wp-content\/uploads\/2026\/10\/favicon-dark.png";

    function applyFavicon( isDark ) {
        var url = isDark ? dark : light;
        var existing = document.querySelectorAll('link[rel="icon"]');
        existing.forEach(function(el) { el.parentNode.removeChild(el); });
        var link = document.createElement('link');

        link.href = url;

<script id="imgareaselect-js" src="https://wired-cardinal.10web.cloud/wp-includes/js/imgareaselect/jquery.imgareaselect.min.js?ver=7.1.3"></script>

    <script type="text/javascript">
        // Debug: Check what scripts are loaded
        console.log('Available global variables:', Object.keys(window).filter(key => key.includes('wvc')));

        // The editor's files can be missing while the page loads: a theme update
        // (e.g. the auto-update run by WP-Cron) replaces the wvc-theme folder, so
        // the chunks this page was printed with 404 a moment later. The page then
        // keeps its loading dots, waits for the theme's files to be back and
        // reloads, which prints the new build's files. Each further reload of the
        // same tab waits longer (counted in sessionStorage); a failure that
        // lasts stops after a few reloads and shows a message with a Reload button.
        var wvcEditorManifestUrl = "https:\/\/wired-cardinal.10web.cloud\/wp-content\/themes\/wvc-theme\/app\/assets\/manifest.json";
        var wvcEditorReloadsKey = 'wvc-editor-load-reloads';
        var wvcEditorHasFailed = false;

        // Calls back once the theme's files are there again: the manifest the next
        // page load prints the chunks from, and the entry it names. Not by status
        // alone — a missing .json (or any file asked with a query string) is
        // answered by WordPress with a 200 page, so the manifest has to parse.
        function wvcEditorWaitForFiles(callback) {
            if (!wvcEditorManifestUrl) {
                // The single-file build has no manifest: a pause for the update
                setTimeout(callback, 3000);
                return;
            }
            var checkAgain = function () {
                setTimeout(function () {
                    wvcEditorWaitForFiles(callback);
                }, 2000);
            };
            fetch(wvcEditorManifestUrl, { cache: 'no-store' })
                .then(function (response) {
                    return response.json();
                })
                .then(function (manifest) {
                    var entry = Object.keys(manifest || {}).map(function (key) {
                        return manifest[key];
                    }).filter(function (chunk) {
                        return chunk && chunk.isEntry && chunk.file;
                    })[0];
                    if (!entry) {
                        checkAgain();
                        return;
                    }
                    var assetsUrl = wvcEditorManifestUrl.replace(/manifest\.json$/, '');
                    return fetch(assetsUrl + entry.file, { method: 'HEAD', cache: 'no-store' }).then(function (response) {
                        if (response.ok) {
                            // The other chunks are copied in around the entry: a moment for them
                            setTimeout(callback, 1000);
                        } else {
                            checkAgain();
                        }
                    });
                })
                .catch(checkAgain);
        }

        // After this many reloads the failure is not a theme update (offline, a
        // blocked chunk, a broken build), so the page stops and asks instead
        var wvcEditorMaxReloads = 5;

        // A dynamic import that could not be fetched, as each browser words it,
        // or a stylesheet Vite could not preload for a chunk
        function wvcEditorIsChunkLoadError(error) {
            var message = String((error && error.message) || error || '');
            return /dynamically imported module|Importing a module script failed|Unable to preload CSS/i.test(message);
        }

        // Replaces the loading dots with a message and a button to try again
        function wvcEditorShowReloadPrompt() {
            var loadingEl = document.getElementById('wvc-editor-loading');
            if (!loadingEl) {
                return;
            }
            loadingEl.innerHTML =
                '<div class="wvc-editor-load-error" role="alert">' +
                    '<p>' + "The editor could not be loaded. Check your connection and try again." + '</p>' +
                    '<button type="button" class="wvc-back-button">' + "Reload" + '</button>' +
                '</div>';
            loadingEl.querySelector('button').addEventListener('click', function () {
                try {
                    sessionStorage.removeItem(wvcEditorReloadsKey);
                } catch (e) {}
                window.location.reload();
            });
        }

        function wvcEditorLoadFailed(reason) {
            if (wvcEditorHasFailed) {
                return;
            }
            wvcEditorHasFailed = true;
            console.error('WVC Editor failed to load', reason);

            // 0s, 2s, 4s, 8s, 16s before reloading again; when the reloads cannot
            // be counted, the page asks rather than risk reloading forever
            var reloads;
            try {
                reloads = parseInt(sessionStorage.getItem(wvcEditorReloadsKey), 10) || 0;
                if (reloads < wvcEditorMaxReloads) {
                    sessionStorage.setItem(wvcEditorReloadsKey, String(reloads + 1));
                }
            } catch (e) {
                reloads = wvcEditorMaxReloads;
            }
            if (reloads >= wvcEditorMaxReloads) {
                wvcEditorShowReloadPrompt();
                return;
            }
            var delay = reloads ? 1000 * Math.pow(2, reloads) : 0;

            wvcEditorWaitForFiles(function () {
                setTimeout(function () {
                    window.location.reload();
                }, delay);
            });
        }

        function wvcEditorLoaded() {
            try {
                sessionStorage.removeItem(wvcEditorReloadsKey);
            } catch (e) {}
        }

        // Function to initialize editor when everything is ready
        function initializeWvcEditor() {
            console.log('Initializing WVC Editor...');

            // Check if variables are available
            if (typeof WVC === 'undefined') {
                console.error('WVC is not defined');
                console.log('Available window variables:', Object.keys(window).filter(key => key.includes('wvc')));
                return false;
            }

            // The editor bundle is deferred (see enqueue_editor_assets), so on the
            // first try here it has usually not run yet. Report not-ready, so the
            // DOMContentLoaded retry below starts it — deferred scripts have all
            // run by then — and keep the loading message up until it does.
            var hasInit =
                typeof window.initVibeChatWidget === 'function' ||
                typeof window.VibeChatWidget?.initVibeChatWidget === 'function' ||
                typeof window.VibeChatWidget === 'function';
            if (!hasInit) {
                return false;
            }

            // The editor's stylesheets load without blocking the page (see
            // load_editor_style_without_blocking), so they can still be on their
            // way here. Keep the loading dots up and start once they are in, rather
            // than mounting the editor unstyled. Reported as handled, so the
            // retries below stop: the tracker calls back into this when they land.
            if (typeof window.wvcEditorStylesReady === 'function' &&
                !window.wvcEditorStylesReady(initializeWvcEditor)) {
                return true;
            }

            var loadingEl = document.getElementById('wvc-editor-loading');
            var contentEl = document.getElementById('wvc-editor-content');

            var showEditor = function () {
                wvcEditorLoaded();

                if (loadingEl) {
                    loadingEl.style.display = 'none';
                }

                if (contentEl) {
                    contentEl.style.display = 'block';
                }
            };

            var started;
            if (typeof window.initVibeChatWidget === 'function') {
                console.log('Initializing widget via window.initVibeChatWidget...');
                started = window.initVibeChatWidget('wvc-editor-root');
            } else if (typeof window.VibeChatWidget?.initVibeChatWidget === 'function') {
                console.log('Initializing widget via VibeChatWidget.initVibeChatWidget...');
                started = window.VibeChatWidget.initVibeChatWidget('wvc-editor-root');
            } else if (typeof window.VibeChatWidget === 'function') {
                console.log('Initializing widget via VibeChatWidget constructor...');
                started = window.VibeChatWidget('wvc-editor-root');
            } else {
                console.error('No widget initialization function found');
            }

            // The chunked editor's init returns a promise: its small entry starts
            // Firebase and then waits for the app chunk to download. The loading
            // dots stay up until the app has started; a single-file build starts
            // at once, as before. It rejects when the app chunk could not be
            // loaded, which is handled like the entry not loading at all, and
            // when the app's own init throws: then the editor is shown, as
            // before, with whatever the app rendered.
            if (started && typeof started.then === 'function') {
                started.then(showEditor, function (error) {
                    if (wvcEditorIsChunkLoadError(error)) {
                        wvcEditorLoadFailed(error);
                        return;
                    }
                    console.error('WVC Editor failed to start', error);
                    showEditor();
                });
            } else {
                showEditor();
            }

            return true;
        }

        // Try to initialize immediately
        if (!initializeWvcEditor()) {
            // If not ready, wait for DOM and try again
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM Content Loaded');

                // Deferred scripts have run by now, so try at once rather than
                // after a pause; the delayed tries stay as fallbacks. Still not
                // there after them, the editor's scripts failed to load.
                if (!initializeWvcEditor()) {
                    setTimeout(function() {
                        if (!initializeWvcEditor()) {
                            setTimeout(function () {
                                if (!initializeWvcEditor()) {
                                    wvcEditorLoadFailed('The editor scripts did not load');
                                }
                            }, 500);
                        }
                    }, 100);
                }
            });
        }
    </script>
